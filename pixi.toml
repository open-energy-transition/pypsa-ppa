[workspace]
name = "pypsa-ppa"
version = "0.1.0"
description = "PyPSA-based toolkit for simulating and optimising PPAs under different scenarios."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.13"
pypsa = ">=1.3.0,<2"
highspy = ">=1.15.1,<2"
linopy = ">=0.9.0,<1.0"
pandas = ">=3.0,<4.0"
numpy = ">=1.26"
pyarrow = ">=15"
openpyxl = ">=3.1"
plotly = ">=5.18"
matplotlib = ">=3.8"
scipy = ">=1.12"
streamlit = ">=1.36"
# Notebook support
jupyter = ">=1.0"
ipykernel = ">=6.0"
nbformat = ">=5.9"
streamlit-folium = ">=0.27.2,<0.28"
folium = ">=0.20.0,<0.21"
highs = ">=1.15.1,<2"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"

[pypi-dependencies]
pypsatopo = ">=0.2"
entsoe-py = ">=0.6"

[tasks]
app = "streamlit run streamlit_app.py"
notebook = { cmd = "jupyter notebook notebooks/", description = "Launch Jupyter for the worked example notebook" }
test = { cmd = "pytest", description = "Run the test suite" }
